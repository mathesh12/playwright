name: Playwright CI
 
on:
  push:
    branches:
      - main
 
jobs:
  playwright-test:
 
    runs-on: ubuntu-latest
 
    steps:
 
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Build Docker Image
        run: docker build -t playwright-demo .
 
      - name: Run Playwright Tests
        run: docker run --rm playwright-mathesh
